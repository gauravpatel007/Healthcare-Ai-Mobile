# Merge this location into the existing LifeOS nginx server block.
# Use the same upstream as the existing /api/ location. This address matches
# docker-compose.yml; confirm it against the running server before applying.
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
