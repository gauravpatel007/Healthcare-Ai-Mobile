services:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: lifeos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: YOUR_SECURE_PASSWORD
      POSTGRES_DB: lifeos_mobile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos_mobile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Fail before deployment if the environment file was omitted. Silently
      # using another database makes existing accounts appear to lose data.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment .env file}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment .env file}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_VOICE_USE_URL: ${TWILIO_VOICE_USE_URL:-false}
      TWILIO_SMS_TEMPLATE_ONLY: ${TWILIO_SMS_TEMPLATE_ONLY:-false}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://16.171.242.175}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      FITBIT_CLIENT_ID: ${FITBIT_CLIENT_ID:-}
      FITBIT_CLIENT_SECRET: ${FITBIT_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost,capacitor://localhost,http://localhost:5173,http://localhost:3000}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - upload_data:/app/uploads
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    command: >
      sh -c "
        alembic -c /app/alembic.ini upgrade head &&
        uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
      "



  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos_telegram
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment .env file}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - ./backend:/app/backend
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c "cd backend && python run_telegram_bot.py"

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
